<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Christian Mendoza — Video Editor & AI Content Creator."
    >

    <title>
        Christian Mendoza | Video Editor & AI Content Creator
    </title>


    <!-- ========================================
         GOOGLE FONTS
    ========================================= -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- ========================================
         STYLESHEET
    ========================================= -->

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- ========================================
         HEADER
    ========================================= -->

    <header
        class="site-header"
        id="site-header"
    >

        <div class="container header-container">


            <!-- LOGO -->

            <a
                href="#hero"
                class="logo"
                aria-label="Christian Mendoza - Inicio"
            >
                CM.
            </a>


            <!-- DESKTOP NAVIGATION -->

            <nav
                class="desktop-nav"
                aria-label="Navegación principal"
            >

                <a href="#hero">
                    Inicio
                </a>

                <a href="#services">
                    Servicios
                </a>

                <a href="#about">
                    Sobre mí
                </a>

                <a href="#portfolio">
                    Portafolio
                </a>

                <a href="#contact">
                    Contacto
                </a>

            </nav>


            <!-- HEADER ACTIONS -->

            <div class="header-actions">


                <!-- DESKTOP CTA -->

                <a
                    href="https://wa.me/573017127512"
                    class="header-cta"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Hablemos
                </a>


                <!-- MOBILE MENU BUTTON -->

                <button
                    class="menu-toggle"
                    id="menu-toggle"
                    type="button"
                    aria-label="Abrir menú"
                    aria-expanded="false"
                    aria-controls="mobile-menu"
                >

                    <span></span>

                    <span></span>

                </button>

            </div>

        </div>


        <!-- ========================================
             MOBILE NAVIGATION
        ========================================= -->

        <nav
            class="mobile-nav"
            id="mobile-menu"
            aria-label="Navegación móvil"
        >

            <a href="#hero">
                Inicio
            </a>

            <a href="#services">
                Servicios
            </a>

            <a href="#about">
                Sobre mí
            </a>

            <a href="#portfolio">
                Portafolio
            </a>

            <a href="#contact">
                Contacto
            </a>


            <a
                href="https://wa.me/573017127512"
                class="mobile-cta"
                target="_blank"
                rel="noopener noreferrer"
            >
                Hablemos
            </a>

        </nav>

    </header>


    <!-- ========================================
         MAIN
    ========================================= -->

    <main>


        <!-- ========================================
             HERO
        ========================================= -->

        <section
            id="hero"
            class="hero"
        >

        </section>


        <!-- ========================================
             MARQUEE
        ========================================= -->

        <section
            id="marquee"
            class="marquee-section"
        >

        </section>


        <!-- ========================================
             SCROLL ANIMATION
        ========================================= -->

        <section
            id="scroll-animation"
            class="scroll-animation"
        >

        </section>


        <!-- ========================================
             SERVICES
        ========================================= -->

        <section
            id="services"
            class="services"
        >

        </section>


        <!-- ========================================
             RESULTS
        ========================================= -->

        <section
            id="results"
            class="results"
        >

        </section>


        <!-- ========================================
             ABOUT
        ========================================= -->

        <section
            id="about"
            class="about"
        >

        </section>


        <!-- ========================================
             PORTFOLIO
        ========================================= -->

        <section
            id="portfolio"
            class="portfolio"
        >

        </section>


        <!-- ========================================
             CONTACT
        ========================================= -->

        <section
            id="contact"
            class="contact"
        >

        </section>

    </main>


    <!-- ========================================
         FOOTER
    ========================================= -->

    <footer class="site-footer">

    </footer>


    <!-- ========================================
         JAVASCRIPT
    ========================================= -->

    <script src="script.js"></script>

</body>

</html>
